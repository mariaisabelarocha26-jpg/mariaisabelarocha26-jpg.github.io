<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maria Isabela — Designer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
      cursor: none;
    }

    /* Cursor custom */
    .cursor {
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
      z-index: 999;
    }

    header {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: radial-gradient(circle at center, #1a1a1a, #000);
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 2px;
    }

    header p {
      opacity: 0.7;
      margin-top: 10px;
    }

    section {
      padding: 80px 10%;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .card {
      background: #111;
      border-radius: 20px;
      overflow: hidden;
      transition: 0.4s;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      background: #1b1b1b;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* animação scroll */
    .hidden {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease;
    }

    .show {
      opacity: 1;
      transform: translateY(0);
    }

  </style>
</head>

<body>

<div class="cursor"></div>

<header>
  <div>
    <h1>Maria Isabela</h1>
    <p>3D • UX/UI • Direção de Arte • Experiências Digitais</p>
  </div>
</header>

<section>
  <h2>Projetos</h2>

  <div class="projects">

    <div class="card hidden" onclick="openLink('https://www.behance.net/gallery/186640405/Barbies-Dream-Life-AR')">
      <img src="https://via.placeholder.com/400x300">
      <div class="card-content">
        <h3>Barbie’s Dream Life</h3>
        <p>Experiência em AR + Modelagem 3D</p>
      </div>
    </div>

    <div class="card hidden">
      <img src="https://via.placeholder.com/400x300">
      <div class="card-content">
        <h3>MOH</h3>
        <p>Design de produto + UX/UI</p>
      </div>
    </div>

    <div class="card hidden">
      <img src="https://via.placeholder.com/400x300">
      <div class="card-content">
        <h3>Rhode 3D</h3>
        <p>Visualização e animação de produto</p>
      </div>
    </div>

    <div class="card hidden">
      <img src="https://via.placeholder.com/400x300">
      <div class="card-content">
        <h3>Sabrina Carpenter</h3>
        <p>Cenografia 3D e direção visual</p>
      </div>
    </div>

  </div>
</section>

<script>
  // Cursor custom
  const cursor = document.querySelector(".cursor");

  document.addEventListener("mousemove", (e) => {
    cursor.style.top = e.clientY + "px";
    cursor.style.left = e.clientX + "px";
  });

  // Scroll reveal
  const hiddenElements = document.querySelectorAll(".hidden");

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add("show");
      }
    });
  });

  hiddenElements.forEach(el => observer.observe(el));

  // abrir link
  function openLink(url){
    window.open(url, "_blank");
  }
</script>

</body>
</html>
